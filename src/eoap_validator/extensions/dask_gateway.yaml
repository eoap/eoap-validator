# Derived from Duke-GCB/calrissian commit
# 771768852f0f69aac84a63d8f2ca62e16a22b36a (MIT License).
$base: https://calrissian-cwl.github.io/schema#
$namespaces:
  cwl: "https://w3id.org/cwl/cwl#"
$graph:
  - $import: https://w3id.org/cwl/CommonWorkflowLanguage.yml

  - name: DaskGatewayRequirement
    type: record
    extends: cwl:ProcessRequirement
    inVocab: false
    doc: >-
      Indicates that a process requires a Dask cluster procured via
      [Dask Gateway](https://gateway.dask.org/) runtime.
    fields:
      class:
        type: string
        doc: Always 'DaskGatewayRequirement'
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      workerCores:
        type: [int, cwl:Expression]
        doc: Number of CPU cores available for a Dask worker.
      workerCoresLimit:
        type: [int, cwl:Expression]
        doc: Maximum number of CPU cores available for a Dask worker.
      workerMemory:
        type: [string, cwl:Expression]
        doc: Maximum amount of memory available for a Dask worker.
      clusterMaxCores:
        type: [int, cwl:Expression]
        doc: Maximum number of cores available for the Dask cluster.
      clusterMaxMemory:
        type: [string, cwl:Expression]
        doc: Maximum amount of memory available for the Dask cluster.
