$schema: https://json-schema.org/draft/2020-12/schema
title: Report
description: EOAP Validator JSON output report, schema version 1.0. Counts and exit_code describe
  the selected failure threshold.
type: object
allOf:
- $ref: '#/$defs/ReportData'
properties:
  counts:
    $ref: '#/$defs/Counts'
  exit_code:
    type: integer
    minimum: 0
    maximum: 2
    default: 0
  fail_on:
    type: string
    enum:
    - error
    - warning
    default: error
required:
- schema_version
- validator_version
- source
- entrypoint
- profiles
- tool_versions
- dependencies
- dependency_coverage
- findings
- operational_failure
- counts
- exit_code
- fail_on
$defs:
  Finding:
    properties:
      rule_id:
        title: Rule Id
        type: string
      profile:
        title: Profile
        type: string
      status:
        enum:
        - passed
        - failed
        - needs-review
        - not-applicable
        - blocked
        title: Status
        type: string
      severity:
        enum:
        - error
        - warning
        - info
        title: Severity
        type: string
      message:
        title: Message
        type: string
      location:
        $ref: '#/$defs/Location'
      suggestion:
        anyOf:
        - type: string
        - type: 'null'
        default:
        title: Suggestion
      reference:
        anyOf:
        - type: string
        - type: 'null'
        default:
        title: Reference
      instance_path:
        items:
          type: string
        title: Instance Path
        type: array
        default: []
    required:
    - rule_id
    - profile
    - status
    - severity
    - message
    - location
    - suggestion
    - reference
    - instance_path
    title: Finding
    type: object
    additionalProperties: false
  Location:
    properties:
      uri:
        title: Uri
        type: string
      path:
        default: ''
        title: Path
        type: string
      line:
        type:
        - integer
        - 'null'
        minimum: 1
        default:
        description: One-based original-source position, or null when unavailable.
      column:
        type:
        - integer
        - 'null'
        minimum: 1
        default:
        description: One-based original-source position, or null when unavailable.
    required:
    - uri
    - path
    - line
    - column
    title: Location
    type: object
    additionalProperties: false
  ReportData:
    properties:
      schema_version:
        default: '1.0'
        title: Schema Version
        type: string
      validator_version:
        default: 0.1.0
        title: Validator Version
        type: string
      source:
        title: Source
        type: string
      entrypoint:
        anyOf:
        - type: string
        - type: 'null'
        default:
        title: Entrypoint
      profiles:
        additionalProperties:
          type: string
        title: Profiles
        type: object
        default: {}
      tool_versions:
        additionalProperties:
          type: string
        title: Tool Versions
        type: object
        default: {}
      dependencies:
        items:
          type: string
        title: Dependencies
        type: array
        default: []
      dependency_coverage:
        default: Root and resolved process sources; not a complete import/include manifest.
        title: Dependency Coverage
        type: string
      findings:
        items:
          $ref: '#/$defs/Finding'
        title: Findings
        type: array
        default: []
      operational_failure:
        default: false
        title: Operational Failure
        type: boolean
    required:
    - schema_version
    - validator_version
    - source
    - entrypoint
    - profiles
    - tool_versions
    - dependencies
    - dependency_coverage
    - findings
    - operational_failure
    title: ReportData
    type: object
    description: Validation assessment fields populated by the validator before summary calculation.
  Counts:
    title: Counts
    type: object
    additionalProperties: false
    properties:
      passed:
        type: integer
        minimum: 0
        default: 0
      failed:
        type: integer
        minimum: 0
        default: 0
      needs-review:
        type: integer
        minimum: 0
        default: 0
      not-applicable:
        type: integer
        minimum: 0
        default: 0
      blocked:
        type: integer
        minimum: 0
        default: 0
    required:
    - passed
    - failed
    - needs-review
    - not-applicable
    - blocked
unevaluatedProperties: false
